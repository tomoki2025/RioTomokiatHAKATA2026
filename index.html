<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅のしおり">
<meta name="format-detection" content="telephone=no">
<title>旅のしおり</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1c2230; --sub:#5d6677; --line:#e2e5eb;
  --accent:#0f766e; --accent-2:#115e59; --accent-weak:#e3f3f1; --on-accent:#ffffff;
  --fixed:#b45309; --fixed-weak:#fff3e0;
  --danger:#c62828; --danger-weak:#fdecec;
  --ok:#2e7d32; --ok-weak:#e7f5e8;
  --warn:#9a6700; --warn-weak:#fff8c5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --radius:14px; --tabbar-h:62px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --card:#171a21; --text:#e9ecf2; --sub:#9ba4b4; --line:#2a2f3a;
    --accent:#2dd4bf; --accent-2:#14b8a6; --accent-weak:#10302c; --on-accent:#05221f;
    --fixed:#f59e0b; --fixed-weak:#2c2010;
    --danger:#f87171; --danger-weak:#3a1616;
    --ok:#4ade80; --ok-weak:#10301b;
    --warn:#facc15; --warn-weak:#2e290c;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5;
  padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 96px);-webkit-text-size-adjust:100%}
body.has-checkin{padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 290px)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px;font-weight:600}
.muted{color:var(--sub)} .small{font-size:12.5px}
.boot{padding:40px;text-align:center;color:var(--sub)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--sub)}
.btn.light{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.btn.sm{min-height:36px;padding:0 10px;font-size:13.5px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45}
.icon-btn{min-width:44px;min-height:44px;border:0;background:transparent;font-size:15px;font-weight:600;color:var(--accent);border-radius:10px;padding:0 8px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* top bar */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:4px;padding:calc(var(--safe-t) + 6px) 8px 6px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.tb-title{flex:1;min-width:0}
.tb-title .name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.presence{display:flex;gap:2px}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-weak);color:var(--accent);position:relative}
.avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:#22c55e;border:2px solid var(--bg)}

.modebar{margin:8px 12px 0;padding:8px 12px;border-radius:10px;font-size:12.5px;background:var(--warn-weak);color:var(--warn)}
.modebar.err{background:var(--danger-weak);color:var(--danger)}

/* next card */
.next{margin:12px;padding:14px 14px 12px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#0f766e,#134e4a);box-shadow:0 6px 18px rgba(15,118,110,.25)}
@media (prefers-color-scheme: dark){.next{background:linear-gradient(135deg,#115e59,#0b3b38)}}
.next .label{font-size:12px;opacity:.85;font-weight:700;letter-spacing:.04em}
.next .nm{font-size:20px;font-weight:800;line-height:1.3;margin:2px 0}
.next .tm{font-size:14px;opacity:.95}
.next .depart{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.14);font-weight:700}
.next .depart.late{background:#fde2e1;color:#9b1c1c}
.next .nowrow{font-size:13px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2)}
.next .acts{display:flex;gap:8px;margin-top:10px}
.next .acts .btn{flex:1}

/* proposals bar */
.pbar{margin:10px 12px 0;padding:12px;border-radius:14px;background:var(--fixed-weak);border:1px solid var(--fixed);display:flex;align-items:center;gap:10px}
.pbar .t{flex:1;font-size:14px;font-weight:600}

/* timeline */
main{padding:0 12px}
.day-head{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 8px}
.day-head h2{font-size:18px;margin:0}
.day-sum{font-size:12.5px;color:var(--sub)}
.spot{display:grid;grid-template-columns:56px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);scroll-margin-top:80px}
.spot.fixed{border-left:5px solid var(--fixed)}
.spot.active{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.spot.done{opacity:.6}
.spot.skipped{opacity:.5}
.spot.skipped .title{text-decoration:line-through}
.spot .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;line-height:1.2;cursor:pointer}
.spot .time small{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:2px}
.spot .title{font-weight:800;font-size:16px;line-height:1.35;cursor:pointer;word-break:break-word}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--sub)}
.pill.fixed{background:var(--fixed-weak);color:var(--fixed)}
.pill.flex{background:var(--accent-weak);color:var(--accent)}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.need{background:var(--danger-weak);color:var(--danger)}
.resv,.memo{font-size:13px;margin-top:4px;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;white-space:pre-wrap;word-break:break-word}
.memo{color:var(--sub)}
.spot.open .resv,.spot.open .memo{-webkit-line-clamp:unset;display:block}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.travel{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;width:calc(100% - 22px);margin:4px 0 4px 22px;padding:8px 10px;border:0;border-left:2px dashed var(--line);
  background:transparent;color:var(--sub);font-size:13px;text-align:left;cursor:pointer;min-height:40px}
.travel .slack{font-weight:700}
.travel .slack.neg{color:var(--danger)}
.travel .slack.pos{color:var(--sub);font-weight:500}
.nowline{display:flex;align-items:center;gap:8px;color:var(--danger);font-size:12px;font-weight:800;margin:6px 0}
.nowline::before,.nowline::after{content:"";height:2px;background:var(--danger);flex:1;border-radius:2px}
.nowline::before{flex:0 0 14px}
.empty{padding:28px 16px;text-align:center;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.add-inline{margin-top:12px}
.wish{display:grid;grid-template-columns:1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.wish .title{font-weight:800}
.stack>*+*{margin-top:10px}

/* home */
.home{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 10px}
.trip-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.trip-row:first-of-type{border-top:0}

/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabbar-h) + var(--safe-b));padding-bottom:var(--safe-b);
  display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line)}
.tabbar button{flex:1 0 68px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--sub);cursor:pointer;position:relative}
.tabbar .t1{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.tabbar .t2{font-size:11px}
.tabbar button.on{color:var(--accent)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px);z-index:21;width:58px;height:58px;border-radius:50%;border:0;
  background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.22);cursor:pointer}
body.has-checkin .fab{display:none}

/* check-in banner */
.checkin{position:fixed;left:8px;right:8px;bottom:calc(var(--tabbar-h) + var(--safe-b) + 8px);z-index:22;background:var(--card);border:2px solid var(--accent);
  border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);max-width:560px;margin:0 auto}
.checkin .q{font-weight:800;font-size:15px;line-height:1.35;padding-right:36px}
.checkin .s{font-size:12.5px;color:var(--sub);margin:2px 0 8px}
.checkin .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checkin .g .btn{min-height:50px;font-size:15px;white-space:normal;line-height:1.25;padding:6px 10px;text-align:center}
.checkin .g .wide{grid-column:1/-1}
.checkin .x{position:absolute;top:6px;right:6px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + var(--safe-b));animation:up .2s ease;overscroll-behavior:contain}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet h3{margin:4px 0 6px;font-size:18px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:sticky;bottom:calc(-16px - var(--safe-b));background:var(--card);padding:10px 0 4px}
.sheet-actions .grow{flex:1}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon-in{width:62px;flex:0 0 62px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label,.seg4 label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:4px 6px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg input,.seg4 input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked),.seg4 label:has(input:checked){background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg label.dis,.seg4 label.dis{opacity:.5}
.hint{font-size:12.5px;color:var(--sub);margin-top:4px}
.hint.ok{color:var(--ok)} .hint.err{color:var(--danger)}
details{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
details summary{min-height:40px;display:flex;align-items:center;font-weight:600;color:var(--sub);cursor:pointer}
.diff{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.diff .r{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.diff .r:first-child{border-top:0}
.diff .r .b{color:var(--sub);text-decoration:line-through;margin-right:4px}
.diff .r .a{font-weight:800}
.diff .r.skip{background:var(--danger-weak)}
.warnbox{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--danger-weak);color:var(--danger);font-weight:700;font-size:14px}
.okbox{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--ok-weak);color:var(--ok);font-weight:700;font-size:14px}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;width:min(92vw,480px);pointer-events:none}
.toast{padding:10px 14px;border-radius:12px;background:#1f2937;color:#fff;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s ease}
.toast.error{background:#b91c1c}
.toast.ok{background:#166534}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:700px){ main,.home{max-width:640px;margin:0 auto} .next,.pbar,.modebar{max-width:616px;margin-left:auto;margin-right:auto} }
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"><div class="boot">読み込み中…</div></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =====================================================================
   旅のしおり — 共有旅行スケジュール（1ファイル版）
   ・Supabase Realtime で全員の画面に即時反映（未設定時はローカルモード）
   ・PWA（sw.js / manifest.webmanifest）
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
const APP_VERSION = '1.1.0';

/* ---------------- 小物ユーティリティ ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
const randId = (n = 10) => { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; return [...crypto.getRandomValues(new Uint8Array(n))].map((x) => a[x % a.length]).join(''); };
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 容量オーバー等は無視 */ } },
};
const toMin = (t) => { if (!t) return null; const [h, m] = String(t).split(':').map(Number); return Number.isFinite(h) ? h * 60 + (m || 0) : null; };
const fromMin = (m) => { m = Math.round(m); const h = Math.floor(m / 60), mm = ((m % 60) + 60) % 60; return `${pad(h)}:${pad(mm)}`; };
const normTime = (t) => (t ? String(t).slice(0, 5) : null);
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const pDate = (d) => { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); };
const fmtDate = (d) => { const x = pDate(d); return `${x.getUTCMonth() + 1}/${x.getUTCDate()}(${WD[x.getUTCDay()]})`; };
const fmtMD = (d) => { const x = pDate(d); return `${x.getUTCMonth() + 1}/${x.getUTCDate()}`; };
const wd = (d) => WD[pDate(d).getUTCDay()];
const addDays = (d, n) => { const x = pDate(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((pDate(b) - pDate(a)) / 86400000);
const dateRange = (s, e) => { const out = []; for (let d = s; d <= e && out.length < 31; d = addDays(d, 1)) out.push(d); return out; };
function linkify(text) {
  let h = esc(text);
  h = h.replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u.length > 40 ? u.slice(0, 38) + '…' : u}</a>`);
  h = h.replace(/(^|[^\d])(0\d{1,4}-\d{1,4}-\d{3,4})(?!\d)/g, (_, p, tel) => `${p}<a href="tel:${tel.replace(/-/g, '')}">${tel}</a>`);
  return h;
}

/* ---------------- 現在時刻（日本時間）。?now=2026-10-10T14:50 で時刻を差し替えてテスト可 ---------------- */
let nowOverride = null; let overrideSetAt = 0;
function setNow(iso) {
  if (!iso) { nowOverride = null; return; }
  const [d, t] = iso.split('T'); nowOverride = { date: d, min: toMin(t || '00:00') }; overrideSetAt = Date.now();
}
setNow(new URLSearchParams(location.search).get('now'));
function nowJST() {
  if (nowOverride) {
    let min = nowOverride.min + (Date.now() - overrideSetAt) / 60000; let date = nowOverride.date;
    while (min >= 1440) { min -= 1440; date = addDays(date, 1); }
    return { date, min };
  }
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const g = (t) => p.find((x) => x.type === t).value;
  return { date: `${g('year')}-${g('month')}-${g('day')}`, min: Number(g('hour')) * 60 + Number(g('minute')) + Number(g('second')) / 60 };
}

/* ---------------- 距離・移動時間（直線距離×1.4で概算） ---------------- */
const WALK_M_PER_MIN = 75;     // 徒歩 4.5km/h
const RIDE_M_PER_MIN = 400;    // 電車・バスの平均 24km/h
const RIDE_OVERHEAD = 10;      // 駅まで・待ち時間
const WALK_LIMIT_M = 1600;     // これ以下は徒歩扱い
const DEFAULT_TRAVEL = 15;     // 座標がないときの目安
const hasLL = (s) => !!s && s.lat != null && s.lng != null && Number.isFinite(+s.lat) && Number.isFinite(+s.lng);
function haversine(a, b) {
  const R = 6371000, r = (x) => (x * Math.PI) / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function estimateTravel(a, b) {
  if (!a || !b || a.id === b.id) return { min: 0, mode: 'none' };
  if (!hasLL(a) || !hasLL(b)) return { min: DEFAULT_TRAVEL, mode: 'unknown' };
  const route = haversine(a, b) * 1.4;
  if (route < 100) return { min: 0, mode: 'same', km: route / 1000 };
  if (route <= WALK_LIMIT_M) return { min: Math.max(1, Math.ceil(route / WALK_M_PER_MIN)), mode: 'walk', km: route / 1000 };
  return { min: Math.ceil(route / RIDE_M_PER_MIN) + RIDE_OVERHEAD, mode: 'ride', km: route / 1000 };
}
const MODE_LABEL = { walk: '🚶 徒歩', ride: '🚃 電車・バス', manual: '✏️ 手動', unknown: '❔ 目安', same: '📍 すぐ', none: '' };

/* ---------------- GoogleマップURL ---------------- */
function parseMapsUrl(url) {
  const r = { lat: null, lng: null, name: null, short: false };
  let u; try { u = new URL(url); } catch { return r; }
  if (/^(maps\.app\.goo\.gl|goo\.gl|g\.co)$/i.test(u.hostname)) { r.short = true; return r; }
  let s = url; try { s = decodeURIComponent(url.replace(/\+/g, ' ')); } catch { /* そのまま */ }
  let m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (m) { r.lat = +m[1]; r.lng = +m[2]; }
  if (r.lat == null) { m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/); if (m) { r.lat = +m[1]; r.lng = +m[2]; } }
  if (r.lat == null) {
    for (const k of ['q', 'query', 'll', 'center', 'destination', 'daddr', 'sll']) {
      const v = u.searchParams.get(k); const mm = v && v.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (mm) { r.lat = +mm[1]; r.lng = +mm[2]; break; }
    }
  }
  const pm = u.pathname.match(/\/maps\/place\/([^/]+)/);
  if (pm) { try { r.name = decodeURIComponent(pm[1].replace(/\+/g, ' ')); } catch { r.name = pm[1]; } }
  else {
    const q = u.searchParams.get('q') || u.searchParams.get('query');
    if (q && !/^\s*-?\d+\.\d+\s*,/.test(q)) r.name = q.split(/[,，]/)[0].trim();
  }
  return r;
}
function parseMapsText(text) {
  const out = { url: null, name: null, lat: null, lng: null, short: false };
  text = String(text || '').trim(); if (!text) return out;
  const ll = text.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
  if (ll) { out.lat = +ll[1]; out.lng = +ll[2]; return out; }
  const m = text.match(/https?:\/\/[^\s]+/); if (m) out.url = m[0];
  const lines = text.split(/\n+/).map((x) => x.trim()).filter((x) => x && !/https?:\/\//.test(x));
  if (out.url) { const p = parseMapsUrl(out.url); Object.assign(out, { lat: p.lat, lng: p.lng, short: p.short, name: p.name }); }
  if (lines.length) out.name = lines[0];   // iPhoneの共有テキスト「店名\n住所\nURL」
  else if (m && m.index > 0) {              // 1行に潰れた「店名 住所 URL」
    const pre = text.slice(0, m.index).split(/\s*(?:〒|日本、|\d{3}-\d{4})|\s+(?=\S*[都道府県市区町]\S*\d)/)[0].trim();
    if (pre) out.name = pre;
  }
  return out;
}
async function resolveShortUrl(url) {
  if (!CFG.RESOLVE_ENDPOINT) throw new Error('展開APIなし');
  const res = await fetch(`${CFG.RESOLVE_ENDPOINT}?url=${encodeURIComponent(url)}`);
  if (!res.ok) throw new Error('展開失敗 ' + res.status);
  return res.json();
}
const llStr = (s) => `${(+s.lat).toFixed(6)},${(+s.lng).toFixed(6)}`;
function mapOpenUrl(s) {
  if (s.map_url) return s.map_url;
  if (hasLL(s)) return `https://www.google.com/maps/search/?api=1&query=${llStr(s)}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name)}`;
}
function mapDirUrl(to, from) {
  const p = (s) => (hasLL(s) ? llStr(s) : encodeURIComponent(s.name));
  const est = from ? estimateTravel(from, to) : null;
  const mode = est && (est.mode === 'walk' || est.mode === 'same') ? 'walking' : 'transit';
  return `https://www.google.com/maps/dir/?api=1&destination=${p(to)}&travelmode=${mode}${from ? `&origin=${p(from)}` : ''}`;
}

/* ---------------- データストア ---------------- */
const TABLES = ['trips', 'spots', 'wishlist', 'proposals'];
class LocalStore {   // Supabase未設定時：この端末のlocalStorage（同じブラウザの別タブとはBroadcastChannelで同期）
  constructor() {
    this.key = 'tabi.localdb'; this.fns = [];
    this.bc = 'BroadcastChannel' in window ? new BroadcastChannel('tabi-local') : null;
    if (this.bc) this.bc.onmessage = (e) => this.fns.forEach((f) => f(e.data));
  }
  db() { const d = LS.get(this.key, {}); for (const t of TABLES) d[t] = d[t] || []; return d; }
  emit(ev) { this.fns.forEach((f) => f(ev)); this.bc?.postMessage(ev); }
  async loadAll(tripId) {
    const d = this.db();
    return { trip: d.trips.find((t) => t.id === tripId) || null, spots: d.spots.filter((x) => x.trip_id === tripId),
      wishlist: d.wishlist.filter((x) => x.trip_id === tripId), proposals: d.proposals.filter((x) => x.trip_id === tripId && x.status === 'pending') };
  }
  async insertMany(table, rows) {
    const d = this.db(); const ts = new Date().toISOString();
    const full = rows.map((r) => ({ created_at: ts, updated_at: ts, ...r })); d[table].push(...full); LS.set(this.key, d);
    full.forEach((row) => this.emit({ table, type: 'INSERT', row }));
  }
  async update(table, id, patch) {
    const d = this.db(); const i = d[table].findIndex((x) => x.id === id); if (i < 0) throw new Error('見つかりません');
    d[table][i] = { ...d[table][i], ...patch, updated_at: new Date().toISOString() }; LS.set(this.key, d);
    this.emit({ table, type: 'UPDATE', row: d[table][i] }); return d[table][i];
  }
  async remove(table, id) {
    const d = this.db(); d[table] = d[table].filter((x) => x.id !== id);
    if (table === 'trips') for (const t of TABLES.slice(1)) d[t] = d[t].filter((x) => x.trip_id !== id);
    LS.set(this.key, d); this.emit({ table, type: 'DELETE', row: { id } });
  }
  subscribe(tripId, onEvent, onStatus, me, onPresence) { this.fns.push(onEvent); onStatus('local'); onPresence([me]); }
  setPresenceName() {}
}
class SupaStore {
  constructor(sb) { this.sb = sb; this.ch = null; }
  async loadAll(tripId) {
    const q = (t) => this.sb.from(t).select('*').eq('trip_id', tripId);
    const [t, s, w, p] = await Promise.all([
      this.sb.from('trips').select('*').eq('id', tripId).maybeSingle(), q('spots'), q('wishlist'), q('proposals').eq('status', 'pending'),
    ]);
    for (const r of [t, s, w, p]) if (r.error) throw r.error;
    return { trip: t.data, spots: s.data || [], wishlist: w.data || [], proposals: p.data || [] };
  }
  async insertMany(table, rows) { const { error } = await this.sb.from(table).insert(rows); if (error) throw error; }
  async update(table, id, patch) { const { error } = await this.sb.from(table).update(patch).eq('id', id); if (error) throw error; }
  async remove(table, id) { const { error } = await this.sb.from(table).delete().eq('id', id); if (error) throw error; }
  subscribe(tripId, onEvent, onStatus, me, onPresence) {
    this.me = me;
    const ch = this.sb.channel(`trip-${tripId}`, { config: { presence: { key: `${me}#${randId(4)}` } } });
    for (const table of TABLES) {
      const filter = table === 'trips' ? `id=eq.${tripId}` : `trip_id=eq.${tripId}`;
      ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table, filter }, (p) => onEvent({ table, type: 'INSERT', row: p.new }));
      ch.on('postgres_changes', { event: 'UPDATE', schema: 'public', table, filter }, (p) => onEvent({ table, type: 'UPDATE', row: p.new }));
      // DELETE はフィルタできない仕様なので全件受けてIDで判定
      ch.on('postgres_changes', { event: 'DELETE', schema: 'public', table }, (p) => onEvent({ table, type: 'DELETE', row: p.old }));
    }
    ch.on('presence', { event: 'sync' }, () => {
      const st = ch.presenceState();
      onPresence([...new Set(Object.values(st).flat().map((x) => x.name).filter(Boolean))]);
    });
    ch.subscribe(async (status) => { onStatus(status); if (status === 'SUBSCRIBED') { try { await ch.track({ name: this.me }); } catch { /* noop */ } } });
    this.ch = ch;
  }
  async setPresenceName(name) { this.me = name; try { await this.ch?.track({ name }); } catch { /* noop */ } }
}

/* ---------------- 状態 ---------------- */
const S = {
  me: LS.get('tabi.me', ''),
  tripId: new URLSearchParams(location.search).get('t') || '',
  trip: null, spots: [], wishes: [], proposals: [],
  tab: null, store: null, mode: 'local', conn: 'connecting', present: [], loaded: false,
  open: new Set(),            // メモを展開しているカード
};
const isOrganizer = () => !!S.trip && (!S.trip.organizer || S.trip.organizer === S.me);
const tripDates = () => (S.trip ? dateRange(S.trip.start_date, S.trip.end_date) : []);

function normSpot(r) {
  return { ...r, start_time: normTime(r.start_time), duration_min: Number(r.duration_min ?? 60),
    lat: r.lat == null ? null : Number(r.lat), lng: r.lng == null ? null : Number(r.lng),
    travel_min_override: r.travel_min_override == null ? null : Number(r.travel_min_override),
    min_duration_min: r.min_duration_min == null ? null : Number(r.min_duration_min) };
}
function normWish(r) { return { ...r, lat: r.lat == null ? null : Number(r.lat), lng: r.lng == null ? null : Number(r.lng) }; }
function normProposal(r) {
  const j = (v) => (typeof v === 'string' ? (() => { try { return JSON.parse(v); } catch { return []; } })() : v || []);
  return { ...r, changes: j(r.changes), warnings: j(r.warnings) };
}

/* ---------------- 並び・派生データ ---------------- */
const bySpot = (a, b) => (toMin(a.start_time) ?? 9999) - (toMin(b.start_time) ?? 9999)
  || String(a.created_at || '').localeCompare(String(b.created_at || '')) || String(a.name).localeCompare(String(b.name));
const daySpots = (date, withSkipped = true) => S.spots.filter((s) => s.date === date && (withSkipped || s.status !== 'skipped')).sort(bySpot);
const spotEnd = (s) => toMin(s.start_time) + (s.duration_min || 0);
const absOf = (date, min) => dayDiff(S.trip.start_date, date) * 1440 + min;
const absStart = (s) => absOf(s.date, toMin(s.start_time));
const absEnd = (s) => absStart(s) + (s.duration_min || 0);
const nowAbs = () => { const n = nowJST(); return absOf(n.date, n.min); };
const chrono = () => S.spots.filter((s) => s.date && s.start_time).sort((a, b) => absStart(a) - absStart(b) || bySpot(a, b));
function prevOf(spot) { const l = daySpots(spot.date, false); const i = l.findIndex((x) => x.id === spot.id); return i > 0 ? l[i - 1] : null; }
/** from → to の移動時間。from が「直前の予定」なら手動上書きを優先 */
function travelBetween(from, to) {
  if (!from || !to) return { min: 0, mode: 'none' };
  const est = estimateTravel(from, to);
  if (to.travel_min_override != null && prevOf(to)?.id === from.id) return { ...est, min: to.travel_min_override, mode: 'manual', auto: est };
  return est;
}
function absLabel(abs) {   // 旅行開始日からの通算分 → 「10/11 10:00」or「10:00」
  const day = Math.floor(abs / 1440); const date = addDays(S.trip.start_date, day);
  return (date === nowJST().date ? '' : fmtMD(date) + ' ') + fromMin(abs - day * 1440);
}
const shortName = (n, len = 14) => { const s = String(n).replace(/[（(].*?[）)]/g, '').trim() || String(n); return [...s].length > len ? [...s].slice(0, len).join('') + '…' : s; };
const minsText = (m) => { m = Math.round(Math.abs(m)); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}` : `${m}分`; };

/** 今の状況：滞在中・いまの予定・次の予定・出発時刻 */
function getContext() {
  const nAbs = nowAbs();
  const list = chrono().filter((s) => s.status !== 'skipped');
  const today = nowJST().date;
  const active = list.find((s) => s.status === 'active' && s.date === today) || null;   // 前日の「滞在中」の閉じ忘れは無視
  const planned = list.filter((s) => s.status === 'planned');
  let due = null;
  if (!active) { const w = planned.filter((s) => absStart(s) <= nAbs && absEnd(s) > nAbs); due = w.length ? w[w.length - 1] : null; }
  const upcoming = planned.find((s) => s !== due && absStart(s) > (active ? absStart(active) : nAbs)) || null;
  const target = active ? upcoming : due || upcoming;
  const from = active || (target ? prevOf(target) : null);
  const tr = target ? travelBetween(from, target) : null;
  const departAbs = target ? absStart(target) - (tr?.min || 0) : null;
  const tripEnd = (dayDiff(S.trip.start_date, S.trip.end_date) + 1) * 1440;
  const phase = nAbs < 0 ? 'before' : nAbs >= tripEnd ? 'after' : 'during';
  return { nAbs, active, due, upcoming, target, from, tr, departAbs, phase };
}

/* ---------------- 書き込み（楽観的更新→ストアへ） ---------------- */
function applyEvent({ table, type, row }) {
  if (!row) return;
  if (table === 'trips') { if (row.id === S.tripId && type !== 'DELETE') S.trip = { ...S.trip, ...row }; }
  else {
    const key = { spots: 'spots', wishlist: 'wishes', proposals: 'proposals' }[table]; if (!key) return;
    const arr = S[key]; const i = arr.findIndex((x) => x.id === row.id);
    if (type === 'DELETE') { if (i >= 0) arr.splice(i, 1); }
    else {
      if (row.trip_id && row.trip_id !== S.tripId) return;
      const n = table === 'spots' ? normSpot(row) : table === 'wishlist' ? normWish(row) : normProposal(row);
      if (i >= 0) arr[i] = { ...arr[i], ...n }; else arr.push(n);
    }
    if (table === 'proposals') {
      S.proposals = S.proposals.filter((p) => p.status === 'pending');
      if (type === 'INSERT' && row.status === 'pending' && row.created_by && row.created_by !== S.me && isOrganizer()) {
        toast(`🔔 ${row.created_by}さんからリスケ提案が届きました`, '', 4500); notify('リスケ提案が届きました', row.reason || '', 'p:' + row.id);
      }
      if (type === 'UPDATE' && row.created_by === S.me && row.decided_by && row.decided_by !== S.me) {
        if (row.status === 'approved') toast('✓ 提案が確定されました', 'ok', 3500);
        if (row.status === 'rejected') toast('提案は見送られました', '', 3500);
      }
    }
  }
  onDataChanged();
}
let renderQueued = false;
function onDataChanged() {
  saveCache();
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
async function dbInsert(table, rows) {
  rows.forEach((row) => applyEvent({ table, type: 'INSERT', row }));
  try { await S.store.insertMany(table, rows); } catch (e) { fail(e); }
}
async function dbUpdate(table, id, patch) {
  applyEvent({ table, type: 'UPDATE', row: { id, ...patch } });
  try { await S.store.update(table, id, patch); } catch (e) { fail(e); }
}
async function dbRemove(table, id) {
  applyEvent({ table, type: 'DELETE', row: { id } });
  try { await S.store.remove(table, id); } catch (e) { fail(e); }
}
function fail(e) { console.error(e); toast('保存できませんでした：' + (e?.message || e), 'error'); reload(); }
function saveCache() {
  if (!S.tripId || !S.trip) return;
  LS.set('tabi.cache.' + S.tripId, { trip: S.trip, spots: S.spots, wishes: S.wishes, proposals: S.proposals, at: Date.now() });
}
function rememberTrip() {
  const list = LS.get('tabi.trips', []).filter((t) => t.id !== S.tripId);
  list.unshift({ id: S.tripId, name: S.trip.name, start_date: S.trip.start_date, end_date: S.trip.end_date });
  LS.set('tabi.trips', list.slice(0, 10));
}

/* ---------------- 起動 ---------------- */
async function makeStore() {
  if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY) {
    S.mode = 'supabase';
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    return new SupaStore(sb);
  }
  S.mode = 'local'; return new LocalStore();
}
async function init() {
  registerSW();
  try { S.store = await makeStore(); }
  catch (e) { console.error(e); S.conn = 'offline'; window.addEventListener('online', () => location.reload()); }
  if (!S.me) await askName();
  if (!S.tripId) return renderHome();
  const cache = LS.get('tabi.cache.' + S.tripId);
  if (cache?.trip) { S.trip = cache.trip; S.spots = cache.spots || []; S.wishes = cache.wishes || []; S.proposals = cache.proposals || []; S.tab = defaultTab(); render(); }
  if (!S.store) { if (!S.trip) renderNotFound('オフラインのため読み込めません'); return; }
  await reload();
  if (!S.trip) return;
  S.store.subscribe(S.tripId, applyEvent, onConnStatus, S.me, (names) => { S.present = names; renderTopOnly(); });
  checkNotifications();
  setInterval(tick, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reload(); tick(); } });
  window.addEventListener('online', () => { S.conn = S.mode === 'local' ? 'local' : 'connecting'; reload(); });
  window.addEventListener('offline', () => { S.conn = 'offline'; render(); });
}
async function reload() {
  if (!S.store || !S.tripId) return;
  try {
    const d = await S.store.loadAll(S.tripId);
    if (!d.trip) { renderNotFound('この旅行が見つかりません（URLを確認してください）'); return; }
    S.trip = d.trip; S.spots = d.spots.map(normSpot); S.wishes = d.wishlist.map(normWish); S.proposals = d.proposals.map(normProposal);
    S.loaded = true; if (!S.tab) S.tab = defaultTab();
    rememberTrip(); saveCache(); render();
  } catch (e) {
    console.error(e); if (S.mode !== 'local') S.conn = 'offline';
    if (S.trip) render(); else renderNotFound('読み込みに失敗しました：' + (e?.message || e));
  }
}
let wasDisconnected = false;
function onConnStatus(st) {
  if (st === 'local') S.conn = 'local';
  else if (st === 'SUBSCRIBED') { S.conn = 'online'; if (wasDisconnected) reload(); wasDisconnected = false; }
  else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') { S.conn = 'reconnecting'; wasDisconnected = true; }
  renderTopOnly();
}
function defaultTab() { const t = nowJST().date; return tripDates().includes(t) ? t : tripDates()[0] || 'wish'; }
function registerSW() { if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {}); }
function tick() { if (!S.trip) return; render(); checkNotifications(); }

/* ---------------- 描画 ---------------- */
function render() {
  if (!S.trip) return;
  const app = $('#app');
  app.innerHTML = `
    <div id="top">${renderTopbar()}${renderModebar()}</div>
    <div id="pbar">${renderProposalBar()}</div>
    ${renderNext()}
    <main id="list">${S.tab === 'wish' ? renderWishlist() : renderDay(S.tab)}</main>
    <div id="checkin">${renderCheckin()}</div>
    ${renderTabbar()}
    <button class="fab" data-act="add" aria-label="予定を追加">＋</button>`;
  document.body.classList.toggle('has-checkin', !!$('#checkin .checkin'));
}
function renderTopOnly() { const el = $('#top'); if (el && S.trip) el.innerHTML = renderTopbar() + renderModebar(); }
function renderTopbar() {
  const dates = tripDates();
  const avatars = S.present.slice(0, 4).map((n) => `<span class="avatar" title="${esc(n)}">${esc([...n][0] || '?')}</span>`).join('');
  return `<header class="topbar">
    <button class="icon-btn" data-act="home" aria-label="旅行一覧">‹</button>
    <div class="tb-title"><div class="name">${esc(S.trip.name)}</div>
      <div class="sub">${fmtDate(dates[0])}〜${fmtDate(dates[dates.length - 1])}・${esc(S.me)}${isOrganizer() ? '（幹事）' : ''}</div></div>
    <div class="presence">${avatars}</div>
    <button class="icon-btn" data-act="share">共有</button>
    <button class="icon-btn" data-act="settings" aria-label="設定">⚙︎</button>
  </header>`;
}
function renderModebar() {
  if (S.mode === 'local') return `<div class="modebar">ローカルモード：この端末だけに保存（同期なし）。config.js にSupabaseを設定すると共有できます。</div>`;
  if (S.conn === 'offline') return `<div class="modebar err">オフライン：最後に読み込んだ内容を表示中</div>`;
  if (S.conn === 'reconnecting') return `<div class="modebar">再接続中…</div>`;
  return '';
}
function renderTabbar() {
  const today = nowJST().date;
  const days = tripDates().map((d) => `<button class="${S.tab === d ? 'on' : ''}" data-act="tab" data-tab="${d}">
      <span class="t1">${fmtMD(d)}</span><span class="t2">${wd(d)}${d === today ? '・今日' : ''}</span></button>`).join('');
  return `<nav class="tabbar">${days}<button class="${S.tab === 'wish' ? 'on' : ''}" data-act="tab" data-tab="wish">
      <span class="t1">☆</span><span class="t2">行きたい${S.wishes.length ? `(${S.wishes.length})` : ''}</span></button></nav>`;
}
function renderNext() {
  const c = getContext();
  if (c.phase === 'after') return `<section class="next"><div class="label">旅行おわり</div><div class="nm">おつかれさまでした 🎉</div></section>`;
  const later = S.spots.filter((s) => s.date === nowJST().date && !s.start_time && s.status === 'planned');
  const laterHtml = later.length ? `<div class="depart">このあと（時間未定）：${later.map((s) => esc((s.icon || '') + ' ' + s.name)).join('、')}</div>` : '';
  if (!c.target && !c.active) return `<section class="next"><div class="label">次の予定</div><div class="nm">${later.length ? '時間指定の予定はおわり' : '予定はすべて完了 ✨'}</div>${laterHtml}</section>`;
  let h = '<section class="next">';
  if (c.active) {
    const left = absEnd(c.active) - c.nAbs;
    h += `<div class="nowrow">📍 滞在中：<b>${esc(c.active.name)}</b>（〜${fromMin(spotEnd(c.active))}・${left >= 0 ? 'あと' + minsText(left) : minsText(left) + '超過'}）</div>`;
  }
  const t = c.target;

function once(key) { const l = LS.get(tkey('notified'), []); if (l.includes(key)) return false; l.push(key); LS.set(tkey('notified'), l.slice(-200)); return true; }
async function notify(title, body, tag) {
  try { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.([180, 80, 180]); } catch { /* noop */ }
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.showNotification(title, { body, tag, icon: 'icon-192.png', badge: 'icon-192.png', data: { url: location.href } });
    else new Notification(title, { body, tag });
  } catch { try { new Notification(title, { body, tag }); } catch { /* noop */ } }
}
function checkNotifications() {
  const ci = getCheckin();
  if (ci && once(ci.key)) notify(ci.type === 'ending' ? `まもなく終了：${ci.active.name}` : `開始時刻：${ci.next.name}`, 'いまの状況は？（アプリを開いて回答）', ci.key);
  const c = getContext();

    const d = c.departAbs - c.nAbs; const key = `dep:${c.target.id}:${c.departAbs}`;
    if (d <= 5 && d > -3 && once(key)) notify(`そろそろ出発：${c.target.name}`, `${absLabel(c.departAbs)} 出発 → ${c.target.start_time} 開始`, key);
  }
}

/* ---------------- カレンダー書き出し（iPhoneのカレンダー通知を使う用） ---------------- */
function exportICS(onlyFixed) {
  const icsEsc = (t) => String(t || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, (m) => '\\' + m);
  const utc = (date, min) => { const [y, m, d] = date.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 0, Math.round(min)) - 9 * 3600000).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//tabi-shiori//JA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', `X-WR-CALNAME:${icsEsc(S.trip.name)}`];
  for (const s of chrono().filter((x) => x.status !== 'skipped' && (!onlyFixed || x.kind === 'fixed'))) {
    const st = toMin(s.start_time); const tr = travelBetween(prevOf(s), s).min || 0;
    L.push('BEGIN:VEVENT', `UID:${s.id}@tabi-shiori`, `DTSTAMP:${stamp}`, `DTSTART:${utc(s.date, st)}`, `DTEND:${utc(s.date, st + Math.max(s.duration_min, 5))}`,
      `SUMMARY:${icsEsc(`${s.icon || ''} ${s.name}`.trim())}`, `DESCRIPTION:${icsEsc([s.reservation_note, s.memo, mapOpenUrl(s)].filter(Boolean).join('\n'))}`,
      ...(hasLL(s) ? [`GEO:${s.lat};${s.lng}`] : []),
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc('出発：' + s.name)}`, `TRIGGER:-PT${tr + 5}M`, 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  const blob = new Blob([L.join('\r\n')], { type: 'text/calendar' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${S.trip.name}${onlyFixed ? '_固定' : ''}.ics`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function openWishForm(w) {
  const isNew = !w; const x = w || { id: uuid(), name: '', icon: '☆', map_url: '', lat: null, lng: null, note: '' };
  openSheet(`<form id="wish-form" autocomplete="off"><h3>${isNew ? '行きたい場所を追加' : '行きたい場所を編集'}</h3>
    <label class="f">GoogleマップのURL</label>
    <div class="row"><input name="map_url" inputmode="url" placeholder="https://maps.app.goo.gl/…" value="${esc(x.map_url || '')}"><button type="button" class="btn" data-act="paste-url">貼り付け</button></div>
    <div class="hint" id="url-hint"></div>
    <label class="f">名前</label><div class="row"><input name="icon" class="icon-in" maxlength="4" value="${esc(x.icon || '')}"><input name="name" required maxlength="80" value="${esc(x.name)}"></div>
    <label class="f">メモ</label><textarea name="note" rows="3">${esc(x.note || '')}</textarea>
    <label class="f">緯度, 経度（任意）</label><input name="latlng" inputmode="decimal" value="${hasLL(x) ? `${x.lat}, ${x.lng}` : ''}">
    <div class="sheet-actions">${!isNew ? '<button type="button" class="btn danger" data-act="delete-wish">削除</button>' : ''}
      <button type="button" class="btn" data-act="close-sheet">閉じる</button><button type="submit" class="btn primary grow">保存</button></div></form>`, {
    onMount: (sh) => {
      const f = sh.querySelector('form'); f._wish = w; f._id = x.id;
      f.map_url.addEventListener('change', () => handleMapInput(f, f.map_url.value));
      f.map_url.addEventListener('paste', (e) => { const t = e.clipboardData?.getData('text'); if (t) { e.preventDefault(); handleMapInput(f, t); } });
      f.addEventListener('submit', async (e) => {
        e.preventDefault(); const fd = new FormData(f); const ll = readLatLng(fd.get('latlng'));
        const row = { name: fd.get('name').trim(), icon: fd.get('icon').trim() || null, map_url: fd.get('map_url').trim() || null, note: fd.get('note').trim() || null, lat: ll.lat, lng: ll.lng };
        if (!row.name) return;
        if (isNew) await dbInsert('wishlist', [{ id: f._id, trip_id: S.tripId, added_by: S.me, created_at: new Date().toISOString(), ...row }]);
        else await dbUpdate('wishlist', w.id, row);
        closeSheet(); toast('保存しました', 'ok');
      });
    },
  });
}

/* ---------------- 移動時間の手動上書き ---------------- */
function openTravelSheet(spot) {
  const prev = prevOf(spot); if (!prev) return;
  const auto = estimateTravel(prev, spot); const cur = spot.travel_min_override;
  openSheet(`<form id="travel-form"><h3>移動時間</h3>
    <p style="margin:0"><b>${esc(prev.name)}</b><br>↓<br><b>${esc(spot.name)}</b></p>
    <p class="muted small">自動計算：${MODE_LABEL[auto.mode] || ''} 約${auto.min}分${auto.km != null ? `（直線${(auto.km / 1.4).toFixed(2)}km×1.4）` : ''}</p>
    <label class="f">手動で上書き（分）</label>
    <input type="number" name="min" min="0" step="1" inputmode="numeric" placeholder="自動（${auto.min}分）" value="${cur ?? ''}">
    <div class="chips">${[5, 10, 15, 20, 25, 30, 40, 50, 60].map((m) => `<button type="button" class="chip ${cur === m ? 'on' : ''}" data-act="set-travel" data-v="${m}">${m}分</button>`).join('')}</div>
    <a class="btn block" style="margin-top:12px" href="${esc(mapDirUrl(spot, prev))}" target="_blank" rel="noopener">🧭 Googleマップで経路を確認</a>
    <div class="sheet-actions"><button type="button" class="btn" data-act="travel-auto">自動に戻す</button><button type="button" class="btn" data-act="close-sheet">閉じる</button><button type="submit" class="btn primary grow">保存</button></div></form>`, {
    onMount: (sh) => {
      const f = sh.querySelector('form'); f._spot = spot;
      f.addEventListener('submit', async (e) => { e.preventDefault(); await dbUpdate('spots', spot.id, { travel_min_override: numOrNull(f.min.value) }); closeSheet(); });
    },
  });
}

  openSheet(`<h3>共有</h3><p class="muted small">このURLを知っている人は誰でも見て・追加できます（ログインなし）。</p>

      <a class="btn block" href="https://line.me/R/msg/text/?${encodeURIComponent(text + '\n' + url)}" target="_blank" rel="noopener">LINEで送る</a>

    <div class="card" style="box-shadow:none"><div class="small muted">幹事（リスケを確定できる人）</div><b>${esc(org || '未設定')}</b>
      ${isOrganizer() ? `<div class="row" style="margin-top:8px"><input id="org-in" placeholder="幹事を譲る相手の名前" value=""><button class="btn sm" data-act="set-organizer">変更</button></div>`

        <button class="btn sm" data-act="notif-perm" ${Notification.permission !== 'default' ? 'disabled' : ''}>通知を許可する</button>`
        : `<p class="small" style="margin:4px 0">iPhoneは「ホーム画面に追加」したアプリから開くと通知を許可できます（iOS 16.4以降）。</p>`}
      <p class="hint">通知はアプリを開いている間（＋閉じた直後）だけ届きます。予約の時間は下のカレンダー書き出しでiPhoneのアラームにも入れておくと安心です。</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn sm" data-act="ics-fixed">📅 固定の予定をカレンダーへ</button><button class="btn sm" data-act="ics-all">📅 全部</button></div></div>
    <div class="card" style="box-shadow:none"><div class="small muted">接続</div><p class="small" style="margin:4px 0">${S.mode === 'local' ? 'ローカルモード（同期なし）' : `Supabase（${{ online: '同期中 ✓', connecting: '接続中…', reconnecting: '再接続中…', offline: 'オフライン' }[S.conn] || S.conn}）`}</p>
      <button class="btn sm" data-act="reload">再読み込み</button> <button class="btn sm" data-act="export">データを書き出す</button></div>
    <p class="hint">旅行ID：${esc(S.tripId)}・v${APP_VERSION}</p>
    <div class="sheet-actions"><button class="btn grow" data-act="close-sheet">閉じる</button></div>`);

/* ---------------- クリック操作（イベント委譲） ---------------- */
const actions = {
  home: () => { location.href = location.pathname; },
  rename: () => askName(),
  tab: (el) => { S.tab = el.dataset.tab; render(); window.scrollTo({ top: 0 }); },
  add: (el) => (S.tab === 'wish' && !el.dataset.date ? openWishForm() : openSpotForm(null, el.dataset.date ? { date: el.dataset.date } : {})),
  'add-wish': () => openWishForm(),
  'edit-spot': (el) => { const s = S.spots.find((x) => x.id === el.dataset.id); if (s) openSpotForm(s); },
  'edit-wish': (el) => { const w = S.wishes.find((x) => x.id === el.dataset.id); if (w) openWishForm(w); },
  toggle: (el, e) => { if (e.target.closest('a')) return; const id = el.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); $('#spot-' + id)?.classList.toggle('open'); },
  jump: (el) => { const s = S.spots.find((x) => x.id === el.dataset.id); if (!s) return; S.tab = s.date; render(); scrollToSpot(s.id); },
  travel: (el) => { const s = S.spots.find((x) => x.id === el.dataset.id); if (s) openTravelSheet(s); },
  'set-travel': (el) => { const f = el.closest('form'); f.min.value = el.dataset.v; f.requestSubmit(); },
  'travel-auto': async (el) => { const f = el.closest('form'); await dbUpdate('spots', f._spot.id, { travel_min_override: null }); closeSheet(); },
  'set-dur': (el) => { el.closest('form').duration_min.value = el.dataset.v; },
  'paste-url': async (el) => {
    const f = el.closest('form');
    try { const t = await navigator.clipboard.readText(); if (t) return handleMapInput(f, t); } catch { /* 権限なし */ }
    f.map_url.focus(); toast('入力欄を長押しして「ペースト」してください');
  },
  'close-sheet': () => closeSheet(),
  'delete-spot': async (el) => {
    const f = el.closest('form'); if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = '本当に削除？'; return; }
    await dbRemove('spots', f._spot.id); closeSheet(); toast('削除しました');
  },
  'spot-to-wish': async (el) => {
    const s = el.closest('form')._spot; if (!s) return;
    await dbInsert('wishlist', [{ id: uuid(), trip_id: S.tripId, name: s.name, icon: s.icon, map_url: s.map_url, lat: s.lat, lng: s.lng,
      note: [s.reservation_note, s.memo].filter(Boolean).join('\n') || null, added_by: S.me, created_at: new Date().toISOString() }]);
    if (isOrganizer()) await dbRemove('spots', s.id); else await proposeEdit(s, { status: 'skipped' });
    closeSheet(); toast('行きたいリストに移しました');
  },
  'delete-wish': async (el) => {
    const f = el.closest('form'); if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = '本当に削除？'; return; }
    await dbRemove('wishlist', f._wish.id); closeSheet();
  },
  'wish-to-spot': (el) => {
    const w = S.wishes.find((x) => x.id === el.dataset.id); if (!w) return;
    const date = tripDates().includes(nowJST().date) ? nowJST().date : tripDates()[0];
    openSpotForm(null, { date, start_time: suggestStart(date), name: w.name, icon: w.icon || '📍', map_url: w.map_url, lat: w.lat, lng: w.lng, memo: w.note || '', _wishId: w.id });
  },
  share: () => openShare(),
  'copy-share': async () => { if (await copyText(shareUrl())) toast('コピーしました', 'ok'); },
  'native-share': async () => { try { await navigator.share({ title: S.trip.name, text: `「${S.trip.name}」の旅のしおり`, url: shareUrl() }); } catch { /* キャンセル */ } },
  settings: () => openSettings(),
  'set-organizer': async () => { const v = $('#org-in')?.value.trim(); if (!v || !isOrganizer()) return; await dbUpdate('trips', S.tripId, { organizer: v }); closeSheet(); toast(`幹事を「${v}」にしました`); },
  'claim-organizer': async () => { await dbUpdate('trips', S.tripId, { organizer: S.me }); closeSheet(); toast('あなたが幹事になりました'); },
  'notif-perm': async () => { try { const p = await Notification.requestPermission(); toast(p === 'granted' ? '通知を許可しました' : '通知は許可されませんでした'); } catch { /* noop */ } closeSheet(); },
  reload: () => { closeSheet(); reload(); },
  export: async () => {
    const data = JSON.stringify({ trip: S.trip, spots: S.spots, wishlist: S.wishes }, null, 2);
    const blob = new Blob([data], { type: 'application/json' }); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `trip-${S.tripId}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  ci: (el) => doCheckin(el.dataset.a, el.dataset.v),
  'ci-later': () => { const ci = getCheckin(); if (ci) snooze((ci.active || ci.next).id, nowAbs() + 10); render(); toast('10分後にまた聞きます'); },
  'arrive-now': (el) => {
    const c = getContext(); const t = S.spots.find((x) => x.id === el.dataset.id); if (!t) return;
    doCheckin('arrived', null, { type: c.active ? 'ending' : 'due', active: c.active, next: t });
  },
  'open-proposal': (el) => openProposal(el.dataset.id),
  'approve-proposal': (el) => approveProposal(el.dataset.id),
  'reject-proposal': (el) => rejectProposal(el.dataset.id),
  'ics-fixed': () => exportICS(true),
  'ics-all': () => exportICS(false),
  'create-seed': () => createTrip(SEED.trip, SEED.spots, SEED.wishlist),
  'create-empty': () => {
    const t = nowJST().date;
    openSheet(`<form><h3>空の旅行を作成</h3><label class="f">旅行名</label><input name="name" required value="新しい旅行">
      <div class="grid2"><div><label class="f">開始日</label><input type="date" name="s" required value="${t}"></div><div><label class="f">終了日</label><input type="date" name="e" required value="${addDays(t, 1)}"></div></div>
      <div class="sheet-actions"><button type="button" class="btn" data-act="close-sheet">閉じる</button><button class="btn primary grow">作成</button></div></form>`, {
      onMount: (sh) => sh.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault(); const f = e.target; if (f.e.value < f.s.value) return toast('終了日が開始日より前です', 'error');
        createTrip({ name: f.name.value.trim(), start_date: f.s.value, end_date: f.e.value });
      }),
    });
  },
  join: () => {
    const v = ($('#join-in')?.value || '').trim(); if (!v) return;
    let id = v; try { id = new URL(v).searchParams.get('t') || v; } catch { /* IDそのもの */ }
    location.href = `?t=${encodeURIComponent(id)}`;
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault();
  fn(el, e);
});
